<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step Up</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#6B4A3E">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2E1; --card:#FBFCF5; --soft:#DCE5C4; --ink:#1F2A17; --muted:#5B684D; --line:#CAD6B0;
  --violet:#557A2B; --on-violet:#F8FBEE; --coral:#D7263D; --sun:#D7263D; --mint:#C42A40; --mint-soft:#F7DCE0;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121810; --card:#1B2318; --soft:#27331F; --ink:#EEF3E2; --muted:#A3B092; --line:#33412A;
  --violet:#9CC261; --on-violet:#11180A; --coral:#F25C72; --sun:#F25C72; --mint:#D9415A; --mint-soft:#3A1A21; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121810; --card:#1B2318; --soft:#27331F; --ink:#EEF3E2; --muted:#A3B092; --line:#33412A;
  --violet:#9CC261; --on-violet:#11180A; --coral:#F25C72; --sun:#F25C72; --mint:#D9415A; --mint-soft:#3A1A21; color-scheme:dark;}
/* brown & butter yellow */
:root[data-palette="butter"]{
  --bg:#FFF6D8; --card:#FFFCF0; --soft:#F5E6B0; --ink:#3A2717; --muted:#7A634C; --line:#E8D59E;
  --violet:#6B4226; --on-violet:#FFF1C2; --coral:#C9733D; --sun:#E8B930; --mint:#9C6B3C; --mint-soft:#F2E1C2;}
@media (prefers-color-scheme: dark){:root[data-palette="butter"]:not([data-theme="light"]){
  --bg:#1A130C; --card:#251B12; --soft:#34271A; --ink:#FFF3D6; --muted:#C4AE8E; --line:#41311F;
  --violet:#F2C94C; --on-violet:#2A1C0E; --coral:#E09A63; --sun:#F2C94C; --mint:#B97E45; --mint-soft:#3A2A17;}}
:root[data-palette="butter"][data-theme="dark"]{
  --bg:#1A130C; --card:#251B12; --soft:#34271A; --ink:#FFF3D6; --muted:#C4AE8E; --line:#41311F;
  --violet:#F2C94C; --on-violet:#2A1C0E; --coral:#E09A63; --sun:#F2C94C; --mint:#B97E45; --mint-soft:#3A2A17;}
/* chocolate brown & powder blue: only these two, plus lighter/darker shades of each */
:root[data-palette="choco"]{
  --bg:#DCEEF5; --card:#F1F8FB; --soft:#C3E0EC; --ink:#3B2418; --muted:#6B4E3F; --line:#B0D4E3;
  --violet:#4A2C1D; --on-violet:#B9DCEB; --coral:#4A2C1D; --sun:#4A2C1D; --mint:#4A2C1D; --mint-soft:#C3E0EC;}
@media (prefers-color-scheme: dark){:root[data-palette="choco"]:not([data-theme="light"]){
  --bg:#2B1911; --card:#3A2318; --soft:#4A2C1D; --ink:#D6EBF3; --muted:#9FC3D3; --line:#5A3826;
  --violet:#B0D4E8; --on-violet:#2B1911; --coral:#B0D4E8; --sun:#B0D4E8; --mint:#B0D4E8; --mint-soft:#4A2C1D;}}
:root[data-palette="choco"][data-theme="dark"]{
  --bg:#2B1911; --card:#3A2318; --soft:#4A2C1D; --ink:#D6EBF3; --muted:#9FC3D3; --line:#5A3826;
  --violet:#B0D4E8; --on-violet:#2B1911; --coral:#B0D4E8; --sun:#B0D4E8; --mint:#B0D4E8; --mint-soft:#4A2C1D;}
[data-palette="choco"] .dayc.done .dot,[data-palette="choco"] .meal[aria-pressed="true"] .tick,[data-palette="choco"] .req.ok .k,[data-palette="choco"] .stage.past .b{color:var(--on-violet)}
[data-palette="choco"] .drops i.on{background:var(--violet)}
/* mocha & blush pink: only these two, plus lighter/darker shades of each */
:root[data-palette="mocha"]{
  --bg:#FAEBE8; --card:#FFF8F7; --soft:#F3D6D2; --ink:#3D2921; --muted:#7A5A4E; --line:#EBCBC6;
  --violet:#6B4A3E; --on-violet:#F8DAD5; --coral:#6B4A3E; --sun:#6B4A3E; --mint:#6B4A3E; --mint-soft:#F3D6D2;}
@media (prefers-color-scheme: dark){:root[data-palette="mocha"]:not([data-theme="light"]){
  --bg:#271B17; --card:#362722; --soft:#47332C; --ink:#F7E0DC; --muted:#CBAAA2; --line:#553D35;
  --violet:#EEC6C0; --on-violet:#271B17; --coral:#EEC6C0; --sun:#EEC6C0; --mint:#EEC6C0; --mint-soft:#47332C;}}
:root[data-palette="mocha"][data-theme="dark"]{
  --bg:#271B17; --card:#362722; --soft:#47332C; --ink:#F7E0DC; --muted:#CBAAA2; --line:#553D35;
  --violet:#EEC6C0; --on-violet:#271B17; --coral:#EEC6C0; --sun:#EEC6C0; --mint:#EEC6C0; --mint-soft:#47332C;}
[data-palette="mocha"] .dayc.done .dot,[data-palette="mocha"] .meal[aria-pressed="true"] .tick,[data-palette="mocha"] .req.ok .k,[data-palette="mocha"] .stage.past .b{color:var(--on-violet)}
[data-palette="mocha"] .drops i.on{background:var(--violet)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1}
p{margin:.35em 0}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.wrap{max-width:520px;margin:0 auto;padding:14px 18px 110px}

.top{display:flex;justify-content:space-between;align-items:center;margin:4px 0 16px}
.hello{font-family:var(--display);font-weight:800;font-size:1.6rem}
.top-right{display:flex;gap:8px;align-items:center}
.flame{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:800;display:flex;align-items:center;gap:4px;color:var(--violet)}
.flame svg{width:18px;height:18px}
.icon-btn{color:var(--violet)}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:1.1rem}

.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px}
.dayc{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);font-weight:700}
button.dayc{background:none;border:0;padding:0;font-family:inherit;transition:transform .12s ease}
button.dayc:active{transform:scale(.92)}
.exlist{list-style:none;padding:0;margin:10px 0 14px}
.exlist li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.exlist li:last-child{border:0}
.daysum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 14px}
.daysum div{background:var(--bg);border-radius:14px;padding:10px;text-align:center;font-size:.85rem;color:var(--muted)}
.daysum b{display:block;font-size:1.1rem;color:var(--ink)}
.dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font-size:1rem}
.dayc.done .dot{background:var(--mint);border-color:var(--mint);color:#fff}
.dayc.today{color:var(--violet)}
.dayc.today .dot{border-color:var(--violet);border-width:3px}

.hero{background:var(--violet);color:var(--on-violet);border-radius:26px;padding:22px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:210px;height:210px;border-radius:50%;border:30px solid currentColor;opacity:.12;pointer-events:none}
.hero::before{content:"";position:absolute;right:40px;top:96px;width:46px;height:46px;border-radius:50%;background:currentColor;opacity:.1;pointer-events:none}
.hero .kicker{font-weight:700;opacity:.85}
.hero h1{font-size:2.1rem;font-weight:800;margin:4px 0 6px;max-width:80%}
.hero .meta{opacity:.85;margin-bottom:16px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:18px;padding:16px;background:var(--on-violet);color:var(--violet);font-weight:800;font-size:1.15rem;min-height:56px}
.hero .swap{background:none;border:0;color:inherit;opacity:.85;margin-top:10px;text-decoration:underline;font-size:.92rem;padding:6px}
.hero.done{background:var(--mint)}
.hero.done .go{color:var(--mint)}

.label{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:24px 0 10px}
.missions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mission{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.mission .e{color:var(--violet);display:grid;place-items:center;height:32px}.mission .e svg{width:30px;height:30px}.mission.ok .e{color:var(--mint)}
.mission b{font-size:1rem}
.mission.ok{border-color:var(--mint);background:var(--mint-soft)}
.tip{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line)}
.tip .e{font-size:1.5rem}
.buddy{display:flex;gap:14px;align-items:center;margin-top:14px}
.bean{width:86px;height:86px;flex:none;background:none;border:0;padding:0;animation:bob 2.6s ease-in-out infinite}
.bean.boing{animation:boing .55s ease-out}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes boing{30%{transform:scale(1.18,.82)}60%{transform:scale(.9,1.12)}100%{transform:scale(1)}}
.bubble{position:relative;background:var(--soft);border-radius:16px;padding:10px 13px;font-weight:700;font-size:.95rem;line-height:1.35}
.bubble::before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-left:0;border-right-color:var(--soft)}
.lvl{margin-top:10px}
.row-lv{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9rem}
.xpbar{height:9px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .5s}
.newb{background:var(--soft);color:var(--violet);font-weight:800;font-size:.85rem;border-radius:999px;padding:5px 12px;margin-bottom:4px}
.vidrow{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
.vid{color:var(--violet);font-weight:800;padding:8px 14px;border-radius:999px;background:var(--soft);text-decoration:none}
details.move{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:8px;overflow:hidden}
details.move summary{display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;list-style:none}
details.move summary::-webkit-details-marker{display:none}
.me{width:64px;height:45px;border-radius:12px;background:var(--bg);flex:none;overflow:hidden}
.m-anim{background:var(--bg);border-radius:18px;aspect-ratio:200/140;max-width:340px;margin:0 auto 10px;overflow:hidden}
.p-anim{width:min(300px,78vw);aspect-ratio:200/140;background:var(--card);border-radius:24px;border:1px solid var(--line);margin-bottom:6px;overflow:hidden;flex:none}
.guide{border-radius:14px;padding:10px 12px;margin:8px 0;font-size:.92rem;text-align:left}
.guide.setup{background:var(--soft)}
.guide.avoid{border:2px dashed var(--line)}
.w-fig{width:56px;height:39px;flex:none;display:inline-block;background:var(--bg);border-radius:10px;overflow:hidden}
.warm li{align-items:center}
.mn{flex:1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-size:.72rem;font-weight:800;background:var(--violet);color:var(--on-violet);padding:2px 8px;border-radius:999px}
.tag.ghost{background:var(--soft);color:var(--muted)}
.chev{font-size:1.5rem;color:var(--muted);transition:transform .2s;line-height:1}
details.move[open] .chev{transform:rotate(90deg)}
.mbody{padding:0 16px 16px}
.mbody ol{padding-left:20px;margin:6px 0 10px}
.mbody ol li{margin-bottom:4px}
.vidbtn{text-decoration:none;margin-top:6px}

.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 18px;font-weight:800;background:var(--violet);color:var(--on-violet);min-height:52px}
.btn.wide{width:100%}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.sm{min-height:40px;padding:8px 14px;font-size:.92rem;border-radius:12px}
.btn,.go,.mission,.meal,.food,.opt{transition:transform .12s ease}
.btn:active,.go:active,.mission:active,.meal:active,.food:active,.opt:active{transform:scale(.97)}

/* food */
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{width:120px;height:120px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1}
.ring .num small{display:block;font-family:var(--body);font-size:.75rem;color:var(--muted);font-weight:700}
.meal{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:10px;text-align:left}
.meal .e{font-size:2rem}
.meal .t{flex:1}
.meal .tick{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:800}
.meal[aria-pressed="true"]{border-color:var(--mint);background:var(--mint-soft)}
.meal[aria-pressed="true"] .tick{background:var(--mint);border-color:var(--mint);color:#fff}
.foods{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.food{position:relative;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:92px}
.food .e{font-size:1.5rem}
.food.has{border-color:var(--violet)}
.badge{position:absolute;top:8px;right:8px;background:var(--violet);color:var(--on-violet);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:.85rem;padding:0 6px}
.minus{position:absolute;bottom:8px;right:8px;width:30px;height:30px;border-radius:50%;border:0;background:var(--soft);font-weight:800}
.water{display:flex;align-items:center;justify-content:space-between;gap:12px}
.drops{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.drops i{width:12px;height:16px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:var(--soft)}
.drops i.on{background:#3BA4FF}
details.more{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:10px}
details.more summary{font-weight:800;cursor:pointer}
details.more p{margin:.6em 0}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 10px;text-align:center}
.stat .n{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.1}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .hd{font-size:.75rem;color:var(--muted);text-align:center;font-weight:700}
.cal .c{aspect-ratio:1;border-radius:8px;background:var(--soft)}
.cal .c.pre{opacity:.35}.cal .c.s{background:var(--violet)}.cal .c.a{background:var(--sun)}
.cal .c.t{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted);margin-top:10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.path{display:flex;flex-direction:column;gap:0}
.stage{display:flex;gap:14px;align-items:flex-start;position:relative;padding-bottom:16px}
.stage:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:3px;background:var(--line)}
.stage .b{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.3rem;background:var(--soft);flex:none}
.stage.now .b{background:var(--violet);box-shadow:0 0 0 5px var(--soft)}
.stage.past .b{background:var(--mint)}
.req{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:.95rem}
.req .k{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.8rem;flex:none}
.req.ok .k{background:var(--mint);border-color:var(--mint);color:#fff}
.hist{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:10px}
.hist th,.hist td{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
.hist th{color:var(--muted);font-weight:700}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;font-size:.82rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .e{display:grid;place-items:center;height:26px}
nav.tabs button[aria-current="page"]{color:var(--violet)}
nav.tabs button[aria-current="page"] .e{transform:translateY(-1px)}

/* workout player */
#player{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 18px calc(18px + env(safe-area-inset-bottom,0px))}
#player.on{display:flex}
.p-top{display:flex;align-items:center;gap:12px;max-width:520px;width:100%;margin:0 auto}
.p-bar{flex:1;height:10px;background:var(--soft);border-radius:99px;overflow:hidden}
.p-bar i{display:block;height:100%;background:var(--violet);border-radius:99px;transition:width .35s}
.p-count{font-weight:800;font-size:.9rem;color:var(--muted);min-width:44px;text-align:right}
.p-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;max-width:520px;width:100%;margin:0 auto;gap:6px;overflow-y:auto;padding:10px 0}
.p-body>:first-child{margin-top:auto}
.p-body>:last-child{margin-bottom:auto}
.p-emoji{width:120px;height:120px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:3.6rem;border:3px solid var(--line);margin-bottom:8px}
.p-name{font-size:1.9rem;font-weight:800}
.p-amt{font-family:var(--display);font-size:3.6rem;font-weight:800;color:var(--violet);line-height:1}
.p-set{font-weight:800;color:var(--muted)}
.pips{display:flex;gap:6px;justify-content:center;margin:4px 0}
.pips i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--violet)}
.p-cue{max-width:34ch;color:var(--muted);margin-top:6px}
.howbtn{background:none;border:0;color:var(--violet);font-weight:800;padding:8px;text-decoration:underline}
.howbox{background:var(--card);border-radius:18px;padding:14px 16px;text-align:left;width:100%;border:1px solid var(--line)}
.howbox ul{margin:4px 0 8px;padding-left:20px}
.p-foot{max-width:520px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.p-foot .row{display:flex;gap:8px}
.p-foot .row .btn{flex:1}
.big{min-height:64px;font-size:1.25rem;border-radius:20px}
.timer-ring{position:relative;width:210px;height:210px}
.timer-ring svg{transform:rotate(-90deg)}
.timer-ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:4rem}
.rest-title{font-size:1.5rem;font-weight:800}
.warm{list-style:none;padding:0;margin:8px 0 0;text-align:left;width:100%}
.warm li{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--card);border-radius:14px;margin-bottom:6px;border:1px solid var(--line)}
.finish-big{font-size:5rem;line-height:1}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .45s ease-out}

/* sheets */
dialog{border:0;border-radius:24px;padding:0;max-width:min(460px,94vw);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(10,6,30,.5)}
.sheet{padding:20px}
.sheet h2{font-size:1.4rem;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--bg);border:2px solid transparent;border-radius:16px;padding:12px;margin-bottom:8px}
.opt .e{font-size:1.6rem}
.opt[aria-pressed="true"]{border-color:var(--violet)}
.field{display:block;margin-bottom:12px}
.field span{display:block;font-size:.9rem;color:var(--muted);margin-bottom:4px;font-weight:700}
.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.check-row{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-weight:700}
.check-row input{width:22px;height:22px}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:800;z-index:50;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:370px){.dot{width:32px;height:32px}.hero h1{font-size:1.7rem}.p-amt{font-size:3rem}}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.badge-i{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);line-height:1.2}
.medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--violet);color:var(--on-violet);font-family:var(--display);font-weight:800;font-size:.95rem;box-shadow:0 0 0 3px var(--soft)}
.badge-i.locked .medal{background:var(--soft);color:var(--muted);box-shadow:none}
.badge-i.locked{opacity:.6}
.photo-cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo-cmp figure{margin:0;background:var(--bg);border-radius:14px;overflow:hidden;aspect-ratio:3/4;position:relative}
.photo-cmp img{width:100%;height:100%;object-fit:cover;display:block}
.photo-cmp figcaption{position:absolute;left:6px;bottom:6px;background:var(--card);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:.75rem;font-weight:800}
.photo-cmp .empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:.85rem;padding:12px;text-align:center}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px;font-weight:800;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.thumbs button{flex:none;width:52px;height:70px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--bg)}
.thumbs button[aria-pressed="true"]{border-color:var(--violet)}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}
.chart svg{width:100%;height:auto;display:block}
.plank-card{display:flex;gap:14px;align-items:center}
.plank-card .ring{width:72px;height:72px}
.recap-row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.recap-row:last-of-type{border:0}
.hist th,.hist td{white-space:nowrap;padding:6px 6px 6px 0}
/* ---------- livelier look ---------- */
.wrap::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(circle at 105% -2%, var(--soft) 0 150px, transparent 151px),
    radial-gradient(circle at -12% 42%, color-mix(in srgb, var(--soft) 70%, transparent) 0 120px, transparent 121px),
    radial-gradient(circle at 108% 88%, color-mix(in srgb, var(--soft) 60%, transparent) 0 90px, transparent 91px),
    radial-gradient(color-mix(in srgb, var(--line) 75%, transparent) 1.3px, transparent 1.8px) 0 0/22px 22px;}
.card,.mission,.tip,.meal,.food,details.more,details.move,.stat{box-shadow:0 10px 24px -14px color-mix(in srgb, var(--violet) 55%, transparent)}
.hello{font-size:1.85rem;letter-spacing:-.01em}
.label{display:flex;align-items:center;gap:8px}
.label::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--violet);transform:rotate(45deg);flex:none;opacity:.85}
.hero{--hv:var(--violet);--hov:var(--on-violet);background:linear-gradient(140deg, var(--violet) 10%, color-mix(in srgb, var(--violet) 72%, var(--on-violet)));box-shadow:0 18px 34px -18px color-mix(in srgb, var(--violet) 80%, transparent)}
.hero h1{max-width:calc(100% - 140px)}
.hero .kicker,.hero .meta{max-width:calc(100% - 140px)}
.hero-fig{position:absolute;top:4px;right:2px;width:158px;aspect-ratio:200/140;overflow:hidden;
  --violet:var(--hov);--on-violet:var(--hv);--line:color-mix(in srgb, var(--hov) 45%, transparent);--soft:color-mix(in srgb, var(--hov) 22%, transparent);--muted:color-mix(in srgb, var(--hov) 70%, transparent)}
.hero::after{right:-90px;top:auto;bottom:-110px;opacity:.1}
.hero::before{display:none}
.dayc.today .dot{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.mring{position:relative;width:58px;height:58px;color:var(--violet);display:block}
.mring>svg{transform:rotate(-90deg)}
.mring .fg{transition:stroke-dashoffset .6s ease}
.mring .mi{position:absolute;inset:0;display:grid;place-items:center}
.mring .mi svg{width:25px;height:25px}
.mission{border-radius:24px;gap:3px}
.mission.ok{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.mission.ok .muted{color:var(--on-violet);opacity:.85}
.mission.ok .mring{color:var(--on-violet)}
.mission.ok .mring>svg circle:first-child{stroke:color-mix(in srgb, var(--on-violet) 30%, transparent)}
.tip{background:var(--soft);border:0}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
body.intro .hero,body.intro .buddy,body.intro .mission,body.intro .plank-card,body.intro .tip{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
body.intro .buddy{animation-delay:.08s}
body.intro .mission:nth-child(1){animation-delay:.16s}
body.intro .mission:nth-child(2){animation-delay:.22s}
body.intro .mission:nth-child(3){animation-delay:.28s}
body.intro .plank-card{animation-delay:.34s}
body.intro .tip{animation-delay:.4s}
.pchip{display:flex;align-items:center;gap:10px;width:100%;margin-top:12px;background:var(--card);border:1.5px dashed var(--line);border-radius:999px;padding:11px 16px;font-weight:700;color:var(--muted);text-align:left}
.pdot{width:12px;height:12px;border-radius:50%;background:var(--violet);flex:none}
.pcard{margin-top:14px;border:2px solid var(--violet)}
.pc-top{display:flex;gap:14px;align-items:center}
.pday{width:64px;height:64px;border-radius:50%;background:var(--violet);color:var(--on-violet);display:grid;place-items:center;align-content:center;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;flex:none}
.pday small{font-family:var(--body);font-size:.7rem;font-weight:700;opacity:.85}
.dayc.per::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--violet);margin-top:2px}
.ptog{height:42px;min-width:42px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--violet);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 9px;font-weight:800}
.ptog.on{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.ptog.on svg path{fill:currentColor}
.top-right{gap:6px;flex:none}
.top{gap:10px}
.hello{font-size:clamp(1.3rem,5.6vw,1.85rem);line-height:1.1}
.top>div:first-child{flex:1;min-width:0}
.top-right .icon-btn,.top-right .ptog{width:38px;height:38px;min-width:38px}
.top-right .ptog.on{width:auto}
.top-right .flame{padding:6px 10px}
.symbox{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.sym{display:flex;align-items:center;gap:8px;margin-top:8px}
.sym>span{width:58px;flex:none;font-size:.85rem;font-weight:700;color:var(--muted)}
.symopts{display:flex;gap:6px;flex:1}
.symopts button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 4px;font-size:.82rem;font-weight:700;color:var(--ink)}
.symopts button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-violet)}
.symnote{background:var(--soft);border-radius:12px;padding:8px 10px;margin:10px 0 0}
</style>

<script>
const EX = {
  march:{n:"March in place",unit:"sec"}, armc:{n:"Arm circles, both directions",unit:"reps"}, hipc:{n:"Hip circles, each way",unit:"reps"},
  wsquat:{n:"Slow half squats",unit:"reps"}, inch:{n:"Inchworm walk-outs",unit:"reps"},
  squat:{n:"Bodyweight squat",unit:"reps",cues:["Feet shoulder-width apart, toes slightly out","Sit back and down like you’re sitting into a chair","Knees travel in the same direction as your toes; chest stays up"],easier:"Squat down to a chair, touch it, stand up",harder:"Pause for 2 seconds at the bottom"},
  slowsquat:{n:"Slow squat, 3 seconds down",unit:"reps",cues:["Count 3 seconds on the way down","Stand up at normal speed","Stop each rep before your form breaks"],easier:"Squat to a chair",harder:"Add a 2-second pause at the bottom"},

  walk:{n:"Brisk walk",unit:"min",cues:["Pace where you can talk but not sing","Outside, on a terrace, or around the house","Phone in your pocket, not your hand"]},

  hamstr:{n:"Hamstring stretch",unit:"esec",cues:["Seated or lying, one leg straight","Hinge forward from the hips","Gentle stretch, never pain"]},

const ACTIVE = {t:"Walk + core",mins:50,active:true,items:[["walk",[1],[35]],["deadbug",[2],[10]],["revcrunch",[2],[10]],["plank",[2],[30]],["splank",[2],[20]],["catcow",[1],[10]],["hipflex",[1],[30]],["child",[1],[45]]]};

const PLAN_BY_WEEKDAY = {0:"rest",1:"A",2:"active",3:"B",4:"rest",5:"C",6:"active"};

/* ---------- friendlier names ---------- */
P1.A.t = "Squats & push-ups"; P1.B.t = "Legs & abs"; P1.C.t = "Slow & strong";
P2.A.t = "Dumbbell day A"; P2.B.t = "Dumbbell day B"; P2.C.t = "Dumbbell day C";

  if (isStrength(sid)) steps.push({ warm:true });
  sess.items.forEach((it, i) => { const ds = dose(it, s, light); for (let j = 0; j < ds.n; j++) steps.push({ i, j, id:it[0], ds }); });
  return steps;
}
const stepDone = (st, d) => st.warm ? !!d.warm : !!(d.sets[st.i] && d.sets[st.i][st.j]);
function streak(){
  let n = 0, k = dkey();
  if (!(state.days[k] && state.days[k].done)) k = addDays(k, -1);
  while (state.days[k] && state.days[k].done){ n++; k = addDays(k, -1); }
  return n;
}
function weekKeys(k = dkey()){ const dow = (pkey(k).getDay() + 6) % 7; const mon = addDays(k, -dow); return Array.from({length:7}, (_, i) => addDays(mon, i)); }
function protein(d){ let p = (d.pre ? PRE_P : 0) + (d.post ? POST_P : 0); [...FOODS, ...PFOODS].forEach(f => p += (d.food[f.id] || 0) * f.p); return p; }
function ring(pct, size, stroke, color){
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - Math.max(0, Math.min(1, pct)));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--soft)" stroke-width="${stroke}"/><circle class="fg" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}

/* ---------- PROGRESS ---------- */
function renderProgress(){
  const s = state.settings, today = dkey(), wk = weekKeys();
  let str = 0, stepsSum = 0, stepDays = 0;
  wk.forEach(k => { const d = state.days[k]; if (d){ if (d.done && isStrength(d.doneId)) str++; if (d.steps){ stepsSum += d.steps; stepDays++; } } });
  const all = Object.entries(state.days).filter(([,d]) => d.done);
  const phaseStr = all.filter(([k,d]) => isStrength(d.doneId) && diff(s.phaseStart, k) >= 0).length;
  const mon = wk[0], startCal = addDays(mon, -28);
  const cal = ["M","T","W","T","F","S","S"].map(x => `<div class="hd">${x}</div>`).join("") + Array.from({length:35}, (_, i) => {
    const k = addDays(startCal, i), d = state.days[k]; let c = "c";
    if (diff(s.startDate, k) < 0) c += " pre"; if (d && d.done) c += isStrength(d.doneId) ? " s" : " a"; if (k === today) c += " t";
    return `<div class="${c}" title="${fmtDate(k)}"></div>`; }).join("");
  const tests = state.tests.slice().sort((a,b) => a.date < b.date ? 1 : -1);
  const best = f => tests.reduce((m,t) => Math.max(m, +t[f] || 0), 0);
  const last = tests[0], due = !last || diff(last.date, today) >= 14;
  const ph = +s.phase, days = Math.max(0, diff(s.phaseStart, today));
  const reqs = ph === 1 ? [
      [days >= 28, `4 weeks of home workouts (${Math.min(days,28)}/28 days)`],
      [phaseStr >= 12, `12 workouts done (${Math.min(phaseStr,12)}/12)`],
      [best("push") >= 10, `10 push-ups, knee or full (best ${best("push")})`],
      [best("plank") >= 45, `45-second plank (best ${best("plank")} s)`],
      [best("squat") >= 25, `25 squats in 60 seconds (best ${best("squat")})`]]
    : ph === 2 ? [
      [days >= 56, `8 weeks with dumbbells (${Math.min(days,56)}/56 days)`],
      [phaseStr >= 20, `20 workouts done (${Math.min(phaseStr,20)}/20)`],
      [!!s.formOk, "My form feels solid on squats, RDLs, rows and presses"]] : [];
  const ready = reqs.length && reqs.every(r => r[0]);
  const stages = [[1,"🏠","Home workouts","Learn the moves, build the habit"],[2,"🏋️","Dumbbells","Your 3 kg pair, slow and controlled"],[3,"🏟️","Gym","We plan it together"]];
  const pathHTML = stages.map(([n,e,t,sub]) => `<div class="stage ${n < ph ? "past" : n === ph ? "now" : ""}"><span class="b">${n < ph ? "✓" : e}</span><div style="flex:1"><b>${t}</b>${n === ph ? " <span class=\"small\" style=\"color:var(--violet);font-weight:800\">You’re here</span>" : ""}<div class="small muted">${sub}</div>
    ${n === ph && reqs.length ? `<div style="margin-top:8px"><div class="small" style="font-weight:800;margin-bottom:2px">To unlock the next stage:</div>${reqs.map(([ok,t]) => `<div class="req${ok ? " ok" : ""}"><span class="k">${ok ? "✓" : ""}</span><span>${t}</span></div>`).join("")}
      ${ph === 2 ? `<button class="btn ghost sm" data-act="formok" style="margin-top:6px">${s.formOk ? "Untick form check" : "Tick: my form feels solid"}</button>` : ""}
      ${ready ? `<button class="btn wide" data-act="levelup" style="margin-top:10px">🎉 Unlock ${ph === 1 ? "dumbbells" : "the gym"}</button>` : ""}</div>` : ""}</div></div>`).join("");
  return `

      <div class="stat"><div class="n">${str}/3</div><div class="small muted">workouts this week</div></div>

    <div class="label">2-week check-in</div>
    <div class="card"><p style="margin-top:0">${due ? "<b>Check-in time!</b> Test yourself and see how far you’ve come." : `Next check-in around <b>${fmtDate(addDays(last.date,14))}</b>.`}</p>

    <div class="label">Waist and weight</div>
    <div class="card">${trendChart()}</div>

}

/* ---------- WORKOUT PLAYER ---------- */
const P = { open:false, steps:[], idx:0, mode:"work", left:0, total:0, iv:null, how:false, t0:0 };
function openPlayer(){
  const d = day(), sid = todaySid();
  P.sid = sid; P.steps = buildSteps(sid);
  P.idx = P.steps.findIndex(s => !stepDone(s, d)); if (P.idx < 0) P.idx = P.steps.length - 1;
  P.mode = "work"; P.how = !P.steps[P.idx].warm && isNewMove(P.steps[P.idx].id); P.t0 = Date.now(); P.open = true;
  $("#player").classList.add("on"); document.body.style.overflow = "hidden";
  drawPlayer(); say(spokenStep(P.steps[P.idx]));
}
function closePlayer(){ clearInterval(P.iv); try { speechSynthesis.cancel(); } catch(e){} P.open = false; $("#player").classList.remove("on"); document.body.style.overflow = ""; render(); }
function pTop(){
  const pct = Math.round(P.steps.filter(s => stepDone(s, day())).length / P.steps.length * 100);
  return `<div class="p-top"><button class="icon-btn" data-act="pclose" aria-label="Close workout (progress is saved)">✕</button><div class="p-bar"><i style="width:${pct}%"></i></div><span class="p-count">${Math.min(P.idx+1, P.steps.length)}/${P.steps.length}</span></div>`;
}
function stepLabel(st){ return st.warm ? "Warm-up" : EX[st.id].n; }
function drawPlayer(){
  const el = $("#player"), st = P.steps[P.idx];
  if (P.mode === "finish"){
    const mins = Math.max(1, Math.round((Date.now() - P.t0) / 60000)), sets = P.steps.filter(s => !s.warm).length, sk = streak();
    el.innerHTML = `${pTop()}<div class="p-body"><div class="pop" style="width:150px;height:150px">${beanSVG("party")}</div><h1 class="p-name">${P.sid === "rest" ? "Rest day done!" : "Workout done!"}</h1>
      <p class="muted" style="font-size:1.1rem">${P.sid === "rest" ? "Recovery counts. Your muscles thank you." : `${sets} sets in about ${mins} min. That’s real progress.`}</p>
      <div class="stats" style="width:100%;margin-top:14px"><div class="stat"><div class="n">🔥 ${sk}</div><div class="small muted">day streak</div></div><div class="stat"><div class="n">${sets}</div><div class="small muted">sets</div></div><div class="stat"><div class="n">${mins}</div><div class="small muted">minutes</div></div></div>
      <p style="margin-top:14px;font-weight:800">+${sets * 5 + 50} XP earned</p><p class="muted">${day().post || P.sid === "rest" ? "" : "Now go have your soya chunks 🫘"}</p></div>
      <div class="p-foot"><button class="btn wide big" data-act="pclose">Back home</button></div>`;
    return;
  }
  if (P.mode === "rest"){
    const nx = P.steps[P.idx];
    el.innerHTML = `${pTop()}<div class="p-body"><div class="rest-title">Rest & breathe</div>
      <div class="timer-ring" id="tring">${ring(P.left / P.total, 210, 16, "var(--sun)")}<div class="num" id="tnum">${P.left}</div></div>
      <p class="muted">Next up</p>${nx.warm ? "" : `<span class="w-fig" style="width:96px;height:67px">${figSVG(nx.id)}</span>`}<b style="font-size:1.2rem">${stepLabel(nx)}</b><span class="muted">${nx.warm ? "" : `${nx.ds.text}, set ${nx.j+1} of ${nx.ds.n}`}</span></div>
      <div class="p-foot"><div class="row"><button class="btn ghost" data-act="radd">+15 sec</button><button class="btn" data-act="rskip">I’m ready ▶</button></div></div>`;

  }

  const middle = running

      ${running ? "" : ANIM[st.id] ? `<div class="p-anim">${figSVG(st.id)}</div>` : `<div class="p-emoji">${EMO[st.id] || "💪"}</div>`}
      ${!running && isNewMove(st.id) ? `<div class="newb">✨ New move! Tips are open below</div>` : ""}
      <h1 class="p-name">${ex.n}</h1>
      ${ds.n > 1 ? `<div class="p-set">Set ${st.j+1} of ${ds.n}</div>${pips}` : ""}
      ${middle}${label}
      ${!running && ex.cues ? `<p class="p-cue">${ex.cues[0]}</p><div class="vidrow"><button class="howbtn" data-act="how">${P.how ? "Hide tips" : "How do I do this?"}</button></div>${how}` : ""}

function tick(){

  const side = $("#tside"); const st = P.steps[P.idx];
  if (side && st && st.ds && st.ds.u === "esec"){
    if (P.left === Math.floor(P.total/2)){ beep(660); buzz(150); say("Switch sides"); }

  }

}

/* voice: picks the most natural voice on the phone, and talks like a person, not a robot */
const pickOne = a => a[Math.floor(Math.random() * a.length)];
const voiceScore = v => (/natural|neural|enhanced|premium|wavenet|studio/i.test(v.name) ? 6 : 0) + (/google/i.test(v.name) ? 3 : 0) + (/en[-_]IN/i.test(v.lang) ? 2 : /en[-_](GB|US|AU)/i.test(v.lang) ? 1 : 0) + (v.localService === false ? 1 : 0);
const enVoices = () => ("speechSynthesis" in window ? speechSynthesis.getVoices() : []).filter(v => /^en/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a));
function pickVoice(name){ const vs = enVoices(); return (name && vs.find(v => v.name === name)) || vs[0] || null; }
function say(text, opts){
  const o = opts || {};
  if ((!o.force && state.settings.voiceOff) || !("speechSynthesis" in window)) return;
  try {
    const v = pickVoice(o.voice !== undefined ? o.voice : state.settings.voiceName);
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text).replace(/–/g, " to "));
    if (v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-IN";
    u.rate = o.rate || state.settings.voiceRate || 1; u.pitch = 1; speechSynthesis.speak(u);
  } catch(e){}
}
function fillVoices(sel){
  const vs = enVoices(), cur = state.settings.voiceName || "";
  sel.innerHTML = `<option value="">Automatic (most natural)</option>` + vs.map(v => `<option value="${esc(v.name)}">${esc(v.name.replace(/^(Google|Microsoft)\s*/i, ""))} (${esc(v.lang)})</option>`).join("");
  sel.value = vs.some(v => v.name === cur) ? cur : "";
}
if ("speechSynthesis" in window) speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", () => { const sel = $("#seVoiceName"); if (sel) fillVoices(sel); });

const spokenName = st => st.warm ? "the warm-up" : EX[st.id].n.split(",")[0].split("(")[0].trim().toLowerCase();
function spokenStep(st){

}

  const wk = weekKeys(), days = wk.map(k => state.days[k]).filter(Boolean);
  const str = days.filter(d => d.done && isStrength(d.doneId)).length, act = days.filter(d => d.done && !isStrength(d.doneId)).length;
  const sd = days.filter(d => d.steps), avg = sd.length ? Math.round(sd.reduce((a, d) => a + d.steps, 0) / sd.length) : 0;
  let best = null; wk.forEach(k => { const d = state.days[k]; if (d && d.steps && (!best || d.steps > state.days[best].steps)) best = k; });
  const pdays = days.filter(d => protein(d) >= proteinGoal()).length;
  const focus = str < 3 ? "Get all 3 strength workouts in. Treat them like a class you’ve booked."
    : avg < 8000 ? "Steps are the weak spot. Add a 10-minute walk after lunch and dinner."

function trendChart(){
  const pts = state.tests.filter(t => t.waist || t.weight).slice().sort((a, b) => a.date < b.date ? -1 : 1);
  if (!pts.length) return `<p class="muted small" style="margin:0">Add your waist and weight in a check-in and your graph appears here. Watching the waist line go down is the best feeling.</p>`;
  const W = 320, H = 150, L = 14, R = 14, T = 22, B = 26, ts = pts.map(p => pkey(p.date).getTime()), t0 = Math.min(...ts), t1 = Math.max(...ts);
  const xs = t => L + (t1 === t0 ? (W - L - R) / 2 : (t - t0) / (t1 - t0) * (W - L - R));
  const series = (key, col, dash) => {
    const ps = pts.filter(p => p[key]); if (!ps.length) return "";
    const vals = ps.map(p => +p[key]); let lo = Math.min(...vals), hi = Math.max(...vals); if (hi - lo < 4){ const m = (hi + lo) / 2; lo = m - 2; hi = m + 2; }
    const ys = v => T + (hi - v) / (hi - lo) * (H - T - B), xy = p => [xs(pkey(p.date).getTime()), ys(+p[key])];
    const d = ps.map((p, i) => (i ? "L" : "M") + xy(p).map(n => n.toFixed(1)).join(" ")).join(" "), last = xy(ps[ps.length - 1]);
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="3" ${dash ? 'stroke-dasharray="6 5"' : ""} stroke-linecap="round" stroke-linejoin="round"/>${ps.map(p => { const [x, y] = xy(p); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${col}"/>`; }).join("")}`;
  };
  const change = (k, u) => { const a = pts.find(p => p[k]), b = [...pts].reverse().find(p => p[k]); if (!a || !b || a === b) return ""; const d = Math.round((b[k] - a[k]) * 10) / 10; return `${k === "waist" ? "Waist" : "Weight"} ${d > 0 ? "+" : ""}${d} ${u} since ${fmtDate(a.date)}`; };
  const notes = [change("waist", "cm"), change("weight", "kg")].filter(Boolean).join(". ");
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Waist and weight over time"><line x1="${L}" y1="${H - B}" x2="${W - R}" y2="${H - B}" stroke="var(--line)" stroke-width="2"/>${series("weight", "var(--muted)", true)}${series("waist", "var(--violet)", false)}<text x="${L}" y="${H - 8}" font-size="11" fill="var(--muted)">${fmtDate(pts[0].date)}</text><text x="${W - R}" y="${H - 8}" font-size="11" text-anchor="end" fill="var(--muted)">${fmtDate(pts[pts.length - 1].date)}</text></svg></div>
    ${(() => { const lw = [...pts].reverse().find(p => p.waist), lk = [...pts].reverse().find(p => p.weight); return `<div class="legend"><span style="--c:var(--violet)">Waist${lw ? ` ${+lw.waist} cm` : ""}</span><span style="--c:var(--muted)">Weight (dashed)${lk ? ` ${+lk.weight} kg` : ""}</span></div>`; })()}${notes ? `<p class="small" style="margin:8px 0 0"><b>${notes}.</b></p>` : ""}`;
}

      save(); sheet.close(); render(); toast("Saved"); break; }
    case "reset": if (confirm("Erase all your workouts, food and check-ins? This can’t be undone.")){ state = defaultState(); save(); sheet.close(); render(); } break;
    case "export": { const blob = new Blob([JSON.stringify(state)], { type:"application/json" }); const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = `step-up-backup-${dkey()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); toast("Backup saved to Downloads"); break; }
    case "checkin": checkinSheet(); break;
    case "cisave": { const v = id => $(id).value; if (!v("#ciPush") && !v("#ciPlank") && !v("#ciSquat") && !v("#ciWaist") && !v("#ciWeight")){ toast("Fill in at least one"); break; }
      state.tests.push({ date:dkey(), push:+v("#ciPush")||0, plank:+v("#ciPlank")||0, squat:+v("#ciSquat")||0, waist:v("#ciWaist") ? +v("#ciWaist") : null, weight:v("#ciWeight") ? +v("#ciWeight") : null, ver:v("#ciVer") });
      if (v("#ciWeight")) state.settings.weight = v("#ciWeight");
      save(); sheet.close(); render(); toast("Check-in saved 📝"); break; }
    case "pre": d.pre = !d.pre; save(); render(); if (d.pre) toast("Fuelled up 🍌"); break;
    case "post": d.post = !d.post; save(); render(); if (d.post) toast("Recovery protein ✓"); break;
    case "food+": d.food[b.dataset.id] = (d.food[b.dataset.id] || 0) + 1; save(); render(); break;
    case "food-": d.food[b.dataset.id] = Math.max(0, (d.food[b.dataset.id] || 0) - 1); save(); render(); break;
    case "water+": d.water = Math.min(20, (d.water || 0) + 1); save(); render(); if (d.water === waterGoal()) toast("Water goal hit 💧"); break;
    case "water-": d.water = Math.max(0, (d.water || 0) - 1); save(); render(); break;
    case "formok": state.settings.formOk = !state.settings.formOk; save(); render(); break;
    case "levelup": { const ph = +state.settings.phase; if (ph < 3){ state.settings.phase = ph + 1; state.settings.phaseStart = dkey(); delete state.settings.formOk; save(); confetti(); tab = "home"; render(); toast(ph === 1 ? "Dumbbell stage unlocked! 🏋️" : "Gym stage unlocked! 🏟️"); } break; }
    /* player */
    case "pclose": closePlayer(); break;
    case "pdone": completeStep(false); break;
    case "pskip": completeStep(true); break;
    case "how": P.how = !P.how; drawPlayer(); break;
    case "tstart": try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} startCountdown(P.steps[P.idx].ds.secs, "timer"); say("Go! Hold it."); break;
    case "tstop": completeStep(false); break;
    case "radd": P.left += 15; P.total += 15; { const tn = $("#tnum"); if (tn) tn.textContent = P.left; } break;
    case "rskip": clearInterval(P.iv); P.mode = "work"; drawPlayer(); say(spokenStep(P.steps[P.idx])); break;
  }
});
sheet.addEventListener("click", e => { if (e.target === sheet) sheet.close(); });

document.addEventListener("change", e => {
  if (e.target.id !== "impFile" || !e.target.files[0]) return;
  e.target.files[0].text().then(t => { const d = JSON.parse(t); if (!d || !d.days || !d.settings) throw 0;
    state = d; save(); applyPalette(); sheet.close(); render(); toast("Backup loaded"); }).catch(() => toast("That file isn’t a Step Up backup"));
});
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}
function seedHistory(){
  if (state.settings.seed1) return;
  state.settings.seed1 = true;
  const add = (k, log) => { const d = state.days[k] || { sets:{}, pre:false, post:false, food:{}, water:0 }; if (!d.done) Object.assign(d, { done:true, doneId:"A", session:"A", log }); state.days[k] = d; };
  add("2026-11-23", "30 squats, 20 crunches");
  add("2026-11-24", "30 squats, 20 crunches, 20 table push-ups, 20 glute bridges");
  if (!state.days["2026-11-25"]) state.days["2026-11-25"] = { sets:{}, pre:false, post:false, food:{}, water:0, done:false, session:"active" };
  save();
}
function seedPeriod(){
  /* start clean: no period logged until you tap the drop yourself */
  if (state.settings.seed4) return; state.settings.seed4 = true;
  state.cycle = { periods:[] }; save();
}
function applyPalette(){
  seedHistory(); seedPeriod();
  if (!state.seen) state.seen = { squat:1, incpush:1, crunch:1, bridge:1 };
  if (!state.settings.themeV3){ state.settings.palette = "mocha"; state.settings.themeV2 = state.settings.themeV3 = true; }
  document.documentElement.dataset.palette = state.settings.palette || "mocha";
}
applyPalette();
document.body.classList.add("intro"); setTimeout(() => document.body.classList.remove("intro"), 1400);
render();
initCloud();
loadPhotos();
</script>
